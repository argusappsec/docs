name: Deploy

# Every branch, because a preview URL per branch is what issue #6 is for: the
# Landing gets iterated by eye, and reviewing it in the abstract is what this
# replaces.
#
# No `pull_request` and no `pull_request_target` — ADR 0009 records why a fork
# gets no preview, and `src/deploy/deploy.test.ts` refuses the family.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# The job reads the checkout and nothing else. Left implicit, these follow a
# repository-wide default that can be widened from a settings page this file
# cannot see.
permissions:
  contents: read

# One run per branch, and the newer push wins. Two runs racing to upload the same
# branch leave whichever finished last being served — not necessarily the newer
# commit — and both report success.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, on purpose: a second one without `needs:` would run beside these
  # steps rather than after them, and could upload while the tests were failing.
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The major is pinned rather than resolved from `engines.node`, which
          # says ">=22.12.0" and would move the build onto a new major the week it
          # ships. `src/deploy/deploy.test.ts` keeps the pin inside what
          # package.json promises.
          node-version: '24'
          cache: npm

      - run: npm ci

      # The gates. Anything red here ends the job before the upload, so the
      # deployment already running stays up — the requirement is met by ordering,
      # never by rolling something back.
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Cloudflare compares `--branch` against the project's production branch,
      # which is `main`, and decides for itself whether this is production or a
      # preview at `<branch>.argusappsec.pages.dev`. One command serves both, so
      # no second code path exists to publish a feature branch over production.
      #
      # The branch arrives through the environment rather than interpolated into
      # the script: git allows `;`, `$` and a backtick in a ref name, so
      # `--branch=${{ github.ref_name }}` written inline is a shell handed to
      # anyone who can push a branch.
      #
      # Wrangler is not a devDependency (ADR 0009), so this version is the one
      # that deploys — hence exact.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.118.0 pages deploy dist --project-name=argusappsec --branch="$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
